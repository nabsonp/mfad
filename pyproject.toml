[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfad"
version = "1.0.0"
description = "Static analysis of micro frontend architectures"
requires-python = ">=3.10"
dependencies = [
    # Closed range on purpose: the core and the language bindings
    # share an ABI, and mixing families corrupts memory silently: the
    # process dies of a segmentation fault at random places, with no
    # exception.
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mfad = "mfad.adapters.driving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mfad.adapters.driven.visualization.assets" = ["*.css", "*.js"]
"mfad.adapters.driven.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
