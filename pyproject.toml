[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damfe"
version = "0.1.0"
description = "Análise estática de arquiteturas micro frontend"
requires-python = ">=3.10"
dependencies = [
    # Faixa fechada de propósito: o núcleo e os bindings de
    # linguagem compartilham uma ABI, e misturar famílias corrompe
    # memória silenciosamente — o processo morre por falha de
    # segmentação em lugares aleatórios, sem exceção.
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.scripts]
damfe = "damfe.adapters.driving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"damfe.adapters.driven.visualization.assets" = ["*.css", "*.js"]
